name: Bug report
description: Report a reproducible functional or rendering problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the scenario, day, controls and visible result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Shareable state URL
      description: Use the in-app Share state control when possible.
  - type: input
    id: environment
    attributes:
      label: Browser and device
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output or screenshots
